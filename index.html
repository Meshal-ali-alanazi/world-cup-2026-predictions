<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>World Cup 2026 Predictions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a1628;
        --bg-deep: #06101f;
        --panel: #0f1f3a;
        --panel-2: #1e3a5f;
        --gold: #ffd700;
        --text: #ffffff;
        --muted: #94a3b8;
        --line: rgba(255, 255, 255, 0.13);
        --success: #22c55e;
        --danger: #ef4444;
        --warning: #f59e0b;
        --info: #38bdf8;
        --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        /* Replace this URL with your uploaded Messi image URL.
           To embed directly, use: url("data:image/jpeg;base64,PASTE_BASE64_HERE") */
        --hero-bg-image: url("https://example.com/messi.jpg");
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 18% 0%, rgba(255, 215, 0, 0.16), transparent 28rem),
          radial-gradient(circle at 80% 18%, rgba(56, 189, 248, 0.12), transparent 30rem),
          linear-gradient(180deg, var(--bg), var(--bg-deep));
        color: var(--text);
        font-family: Inter, Cairo, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body[dir="rtl"] { font-family: Cairo, Inter, ui-sans-serif, system-ui, sans-serif; }
      button, input, select { font: inherit; }

      button {
        min-height: 42px;
        border: 0;
        border-radius: 8px;
        background: var(--gold);
        color: #111827;
        cursor: pointer;
        font-weight: 900;
        padding: 0 16px;
        transition: transform 0.16s ease, background 0.16s ease, border-color 0.16s ease;
      }

      button:hover:not(:disabled) { background: #ffe45c; transform: translateY(-1px); }
      button:disabled { cursor: not-allowed; opacity: 0.55; }

      button.secondary, button.nav-button {
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.07);
        color: var(--text);
      }

      button.secondary:hover:not(:disabled), button.nav-button:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.12);
      }

      button.nav-button.active {
        border-color: rgba(255, 215, 0, 0.65);
        background: rgba(255, 215, 0, 0.16);
        color: var(--gold);
      }

      input, select {
        width: 100%;
        min-height: 42px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.07);
        color: var(--text);
        outline: none;
        padding: 0 12px;
      }

      select option { background: var(--panel); color: var(--text); }
      input:focus, select:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.16); }
      input:disabled { color: var(--muted); background: rgba(255, 255, 255, 0.04); }

      .shell {
        width: min(1240px, calc(100% - 32px));
        margin: 0 auto;
        padding: 24px 0 48px;
      }

      .login-hero {
        position: relative;
        isolation: isolate;
        overflow: hidden;
        min-height: 360px;
        color: #ffffff;
        background-image: var(--hero-bg-image);
        background-size: cover;
        background-position: center top;
        background-repeat: no-repeat;
      }

      .login-hero::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 0;
        background: rgba(0, 0, 0, 0.6);
      }

      .login-hero .shell {
        position: relative;
        z-index: 1;
        padding: clamp(24px, 4vw, 46px) 0;
      }

      .login-hero .brand h1,
      .login-hero .panel-title h2 {
        color: #ffffff;
      }

      .login-hero .brand p,
      .login-hero .panel-title span {
        color: rgba(255, 255, 255, 0.84);
      }

      .login-hero .panel {
        border-color: rgba(255, 255, 255, 0.24);
        background: rgba(0, 0, 0, 0.42);
        backdrop-filter: blur(8px);
      }

      .login-hero input {
        border-color: rgba(255, 255, 255, 0.34);
        background: rgba(255, 255, 255, 0.14);
        color: #ffffff;
      }

      .login-hero input::placeholder {
        color: rgba(255, 255, 255, 0.72);
      }

      .auth-panel {
        max-width: 760px;
        margin-top: 18px;
      }

      .auth-error {
        display: none;
        margin-top: 10px;
        border: 1px solid rgba(239, 68, 68, 0.5);
        border-radius: 8px;
        background: rgba(239, 68, 68, 0.16);
        color: #fecaca;
        font-size: 14px;
        font-weight: 800;
        padding: 10px 12px;
      }

      .auth-error.show {
        display: block;
      }

      .app-shell {
        padding-top: 18px;
      }

      .topbar {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 18px;
        align-items: start;
        margin-bottom: 18px;
      }

      .brand { display: grid; gap: 7px; }
      .brand-mark { color: var(--gold); font-size: 13px; font-weight: 900; text-transform: uppercase; }
      .brand h1 { margin: 0; max-width: 760px; font-size: clamp(34px, 5vw, 66px); line-height: 0.96; letter-spacing: 0; }
      .brand p { margin: 0; max-width: 720px; color: var(--muted); font-size: 15px; }

      .top-actions { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }

      .pill {
        display: inline-flex;
        align-items: center;
        min-height: 36px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.06);
        color: var(--muted);
        padding: 0 12px;
        font-size: 13px;
        font-weight: 800;
      }

      .nav {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        gap: 8px;
        overflow-x: auto;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: rgba(6, 16, 31, 0.88);
        box-shadow: var(--shadow);
        backdrop-filter: blur(12px);
        padding: 8px;
        margin-bottom: 18px;
      }

      .nav-button { flex: 0 0 auto; min-height: 38px; padding: 0 13px; font-size: 13px; }

      .message {
        display: none;
        margin-bottom: 16px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.08);
        padding: 13px 15px;
        font-size: 14px;
      }

      .message.show { display: block; }
      .message.error { border-color: rgba(239, 68, 68, 0.42); background: rgba(239, 68, 68, 0.12); }
      .message.success { border-color: rgba(34, 197, 94, 0.42); background: rgba(34, 197, 94, 0.12); }

      .panel, .card {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: rgba(15, 31, 58, 0.9);
        box-shadow: var(--shadow);
      }

      .panel-header {
        display: flex;
        justify-content: space-between;
        gap: 14px;
        align-items: flex-start;
        border-bottom: 1px solid var(--line);
        padding: 16px;
      }

      .panel-title { display: grid; gap: 4px; }
      .panel-title h2, .panel-title h3 { margin: 0; }
      .panel-title span { color: var(--muted); font-size: 13px; }
      .panel-body { padding: 16px; }

      .auth-box { display: grid; grid-template-columns: minmax(220px, 1fr) auto; gap: 10px; }

      .hero { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(280px, 0.7fr); gap: 16px; }

      .hero-card {
        position: relative;
        isolation: isolate;
        overflow: hidden;
        min-height: 330px;
        border: 1px solid rgba(255, 215, 0, 0.28);
        border-radius: 12px;
        background-color: rgba(6, 16, 31, 0.95);
        background-image:
          linear-gradient(90deg, rgba(6, 16, 31, 0.84), rgba(6, 16, 31, 0.62), rgba(6, 16, 31, 0.78)),
          linear-gradient(180deg, rgba(0, 0, 0, 0.24), rgba(0, 0, 0, 0.5)),
          var(--hero-bg-image);
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: clamp(22px, 4vw, 42px);
        box-shadow: var(--shadow);
      }

      .hero-card > * { position: relative; z-index: 1; }
      .hero-card h2 { margin: 0; font-size: clamp(32px, 5vw, 60px); line-height: 1; letter-spacing: 0; }
      .hero-card p { max-width: 650px; margin: 14px 0 0; color: rgba(255, 255, 255, 0.78); }
      .hero-actions, .inline-actions { display: flex; gap: 10px; flex-wrap: wrap; }

      .stat-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
      .stat { border: 1px solid var(--line); border-radius: 12px; background: rgba(255, 255, 255, 0.06); padding: 14px; }
      .stat-label { color: var(--muted); font-size: 12px; font-weight: 900; text-transform: uppercase; }
      .stat-value { margin-top: 6px; color: var(--gold); font-size: 27px; font-weight: 900; }

      .toolbar { display: grid; grid-template-columns: repeat(5, minmax(120px, 1fr)); gap: 10px; }
      .stack, .match-list { display: grid; gap: 14px; }
      .grid-2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 0.48fr); gap: 16px; }
      .groups-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }

      .date-section { display: grid; gap: 10px; }
      .date-heading { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
      .date-heading h3 { margin: 0; color: var(--gold); font-size: 17px; }
      .date-heading span { color: var(--muted); font-size: 12px; font-weight: 900; }

      .match-card {
        display: grid;
        gap: 14px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.045);
        padding: 16px;
      }

      .match-top { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 12px; font-weight: 800; }
      .match-main { display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; align-items: center; }

      .team { min-width: 0; display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 10px; align-items: center; }
      .team.away { grid-template-columns: minmax(0, 1fr) 48px; text-align: end; }
      .flag-badge { width: 48px; height: 48px; border: 1px solid var(--line); border-radius: 50%; display: grid; place-items: center; background: rgba(255, 255, 255, 0.08); font-size: 25px; }
      .team-name { font-size: 17px; font-weight: 900; overflow-wrap: anywhere; }
      .team-alt { color: var(--muted); font-size: 12px; font-weight: 700; margin-top: 2px; }

      .score-box { min-width: 150px; text-align: center; }
      .score-line { color: var(--gold); font-size: 32px; font-weight: 900; line-height: 1; }

      .status {
        display: inline-flex;
        align-items: center;
        min-height: 25px;
        margin-top: 8px;
        border-radius: 999px;
        padding: 0 9px;
        font-size: 11px;
        font-weight: 900;
        background: rgba(148, 163, 184, 0.16);
        color: var(--muted);
      }

      .status.open { background: rgba(34, 197, 94, 0.16); color: var(--success); }
      .status.live { background: rgba(34, 197, 94, 0.22); color: var(--success); animation: pulse 1.4s infinite; }
      .status.finished { background: rgba(56, 189, 248, 0.16); color: var(--info); }
      @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(34,197,94,0.4); } 50% { box-shadow: 0 0 0 7px rgba(34,197,94,0); } }

      .countdown { margin-top: 8px; color: var(--gold); font-size: 12px; font-weight: 900; }

      .prediction-row { display: grid; grid-template-columns: 82px 20px 82px auto; gap: 10px; align-items: center; border-top: 1px solid var(--line); padding-top: 14px; }
      .prediction-row input { text-align: center; font-weight: 900; }
      .prediction-note, .muted { color: var(--muted); font-size: 13px; }
      .prediction-note { grid-column: 1 / -1; }

      .detail-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; border-top: 1px solid var(--line); padding-top: 14px; }
      .detail-box { min-width: 0; border: 1px solid var(--line); border-radius: 10px; background: rgba(255,255,255,0.05); padding: 10px; }
      .detail-label { color: var(--muted); font-size: 11px; font-weight: 900; text-transform: uppercase; }
      .detail-value { margin-top: 4px; font-weight: 900; }

      .leader-row { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 12px; align-items: center; border-bottom: 1px solid var(--line); padding: 12px 0; }
      .leader-row:last-child { border-bottom: 0; }
      .rank { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,215,0,0.13); color: var(--gold); font-weight: 900; }
      .leader-name { font-weight: 900; overflow-wrap: anywhere; }
      .leader-meta { margin-top: 2px; color: var(--muted); font-size: 12px; }
      .points { color: var(--gold); font-size: 22px; font-weight: 900; }

      table { width: 100%; border-collapse: collapse; }
      th, td { border-bottom: 1px solid var(--line); padding: 8px 6px; text-align: start; font-size: 13px; }
      th { color: var(--muted); font-size: 11px; text-transform: uppercase; }
      tr:last-child td { border-bottom: 0; }
      .qualified td:first-child { color: var(--success); font-weight: 900; }
      .third-place td:first-child { color: var(--warning); font-weight: 900; }

      .bracket { display: grid; grid-template-columns: repeat(6, minmax(220px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 6px; }
      .round { min-width: 220px; display: grid; gap: 10px; align-content: start; }
      .round h3 { margin: 0; color: var(--gold); font-size: 15px; }
      .bracket-match { border: 1px solid var(--line); border-radius: 10px; background: rgba(255,255,255,0.055); padding: 10px; font-size: 13px; }

      .modal { position: fixed; inset: 0; z-index: 30; display: none; place-items: center; background: rgba(0,0,0,0.68); padding: 16px; }
      .modal.show { display: grid; }
      .modal-card { width: min(640px, 100%); max-height: min(760px, calc(100vh - 32px)); overflow: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); box-shadow: var(--shadow); }

      .empty, .loading { color: var(--muted); padding: 22px; text-align: center; }
      .hide { display: none !important; }

      @media (max-width: 1024px) {
        .topbar, .hero, .grid-2 { grid-template-columns: 1fr; }
        .top-actions { justify-content: flex-start; }
        .stat-grid, .groups-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .toolbar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }

      @media (max-width: 640px) {
        .shell { width: min(100% - 20px, 1240px); padding-top: 14px; }
        .auth-box, .stat-grid, .groups-grid, .toolbar, .match-main, .detail-grid { grid-template-columns: 1fr; }
        .team.away { grid-template-columns: 48px minmax(0, 1fr); text-align: start; }
        .team.away .flag-badge { grid-column: 1; grid-row: 1; }
        .team.away > div:not(.flag-badge) { grid-column: 2; }
        .score-box { min-width: 0; order: -1; }
        .prediction-row { grid-template-columns: 1fr 20px 1fr; }
        .prediction-row button { grid-column: 1 / -1; }
      }
    </style>
  </head>

        France:["فرنسا","🇫🇷","I"], Senegal:["السنغال","🇸🇳","I"], Iraq:["العراق","🇮🇶","I"], Norway:["النرويج","🇳🇴","I"],

        England:["إنجلترا","\uD83C\uDFF4\uDB40\uDC67\uDB40\uDC62\uDB40\uDC65\uDB40\uDC6E\uDB40\uDC67\uDB40\uDC7F","L"], Croatia:["كرواتيا","🇭🇷","L"], Ghana:["غانا","🇬🇭","L"], Panama:["بنما","🇵🇦","L"]

      const groupTeams = {
        A:["Mexico","South Africa","South Korea","Czechia"], B:["Canada","Bosnia and Herzegovina","Qatar","Switzerland"], C:["Brazil","Morocco","Haiti","Scotland"],
        D:["United States","Paraguay","Australia","Türkiye"], E:["Germany","Curaçao","Ivory Coast","Ecuador"], F:["Netherlands","Japan","Sweden","Tunisia"],
        G:["Belgium","Egypt","Iran","New Zealand"], H:["Spain","Cape Verde","Saudi Arabia","Uruguay"], I:["France","Senegal","Iraq","Norway"],
        J:["Argentina","Algeria","Austria","Jordan"], K:["Portugal","DR Congo","Uzbekistan","Colombia"], L:["England","Croatia","Ghana","Panama"]
      };

      const state = {
        client:null, player:null, matches:[], leaderboard:[], activePage:"home", activeMatchId:null, channel:null, countdownTimer:null, refreshTimer:null,
        filters:{ group:"all", stage:"all", status:"all", date:"all", search:"" },
        lang: localStorage.getItem(LOCAL_LANG_KEY) || "en"
      };

      const els = {};
      document.addEventListener("DOMContentLoaded", init);

      async function init() {
        cacheElements(); bindEvents(); applyLanguage(); renderNavigation();
        if (!isConfigured()) { setMessage("Replace SUPABASE_URL and SUPABASE_ANON_KEY in index.html before deploying.", "error"); renderApp(); return; }
        if (!window.supabase?.createClient) { setMessage("Supabase JS did not load. Check CDN or network access.", "error"); renderApp(); return; }
        state.client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        state.player = loadPlayer();
        await refreshAll();
        state.refreshTimer = window.setInterval(loadMatches, 60000);
        window.addEventListener("beforeunload", () => { clearCountdownTimer(); if (state.refreshTimer) window.clearInterval(state.refreshTimer); });
      }

      function cacheElements() {
        ["authError","authForm","authPanel","closeModalButton","continueButton","globalMessage","languageButton","mainNav","modalBody","modalSubtitle","modalTitle","nameInput","pageRoot","predictionModal","realtimeStatus","refreshButton","signOutButton","userLabel"].forEach((id) => { els[id] = document.getElementById(id); });
      }

      function bindEvents() {
        els.authForm.addEventListener("submit", savePlayerName);
        els.refreshButton.addEventListener("click", refreshAll);
        els.signOutButton.addEventListener("click", showNameForm);
        els.languageButton.addEventListener("click", toggleLanguage);
        els.mainNav.addEventListener("click", handleClick);
        els.closeModalButton.addEventListener("click", closePredictionModal);
        els.predictionModal.addEventListener("click", (event) => { if (event.target === els.predictionModal) closePredictionModal(); });
        els.pageRoot.addEventListener("click", handleClick);
        els.pageRoot.addEventListener("input", handleInput);
        els.pageRoot.addEventListener("change", handleInput);
        els.modalBody.addEventListener("click", handleClick);
      }

      function isConfigured() {
        return SUPABASE_URL.startsWith("https://") && !SUPABASE_URL.includes("YOUR_PROJECT_REF") && SUPABASE_ANON_KEY.length > 20 && !SUPABASE_ANON_KEY.includes("YOUR_SUPABASE_ANON_KEY");
      }

      async function refreshAll() {
        renderIdentity();
        await Promise.all([loadMatches(), loadLeaderboard()]);
        await configureRealtime();
        renderApp();
      }

      async function loadMatches() {
        if (!state.client) return;
        try {
          let { data, error } = await state.client
            .from("matches")
            .select(EXTENDED_MATCH_SELECT)
            .order("utc_date", { ascending: true });

          if (error && String(error.message || "").includes("Could not find")) {
            const fallback = await state.client
              .from("matches")
              .select(BASIC_MATCH_SELECT)
              .order("utc_date", { ascending: true });
            data = fallback.data;
            error = fallback.error;
          }

          if (error) throw error;
          const predictionMap = await loadCurrentPlayerPredictions(data ?? []);
          state.matches = (data ?? []).map((match) => ({ ...match, prediction: predictionMap.get(String(match.football_data_id)) ?? null }));
          renderApp();
        } catch (error) {
          setMessage(error.message || "Could not load matches.", "error");
        }
      }

      async function loadCurrentPlayerPredictions(matches) {
        const map = new Map();
        if (!state.client || !state.player || matches.length === 0) return map;
        const ids = matches.map((match) => match.football_data_id);
        const { data, error } = await state.client.from("predictions").select("match_id,home_score,away_score,points,updated_at").eq("guest_id", state.player.id).in("match_id", ids);
        if (error) throw error;
        (data ?? []).forEach((prediction) => map.set(String(prediction.match_id), prediction));
        return map;
      }

      async function loadLeaderboard() {
        if (!state.client) return;
        try {
          const { data, error } = await state.client.rpc("leaderboard");
          if (error) throw error;
          state.leaderboard = data ?? [];
        } catch (error) {
          setMessage(error.message || "Could not load leaderboard.", "error");
        }
      }

      async function configureRealtime() {
        if (!state.client) return;
        if (state.channel) { await state.client.removeChannel(state.channel); state.channel = null; }
        state.channel = state.client
          .channel("world-cup-live")
          .on("postgres_changes", { event:"*", schema:"public", table:"predictions" }, debounceRefresh)
          .on("postgres_changes", { event:"*", schema:"public", table:"guest_players" }, debounceRefresh)
          .on("postgres_changes", { event:"*", schema:"public", table:"matches" }, debounceRefresh)
          .subscribe((status) => { els.realtimeStatus.textContent = `Realtime ${status.toLowerCase()}`; });
      }

      let realtimeTimer = null;
      function debounceRefresh() {
        window.clearTimeout(realtimeTimer);
        realtimeTimer = window.setTimeout(() => Promise.all([loadMatches(), loadLeaderboard()]).then(renderApp), 250);
      }

      async function savePlayerName(event) {
        event.preventDefault(); clearMessage(); clearAuthError();
        const rawName = String(els.nameInput.value ?? "").trim();
        if (!isAllowedPlayerName(rawName)) { setAuthError("الاسم غير مسموح به"); return; }
        const displayName = normalizeDisplayName(rawName);
        const current = state.player;
        state.player = { id: current?.id || crypto.randomUUID(), editToken: current?.editToken || randomToken(), displayName };
        setBusy(els.continueButton, true, t("saving"));
        try {
          const { error } = await state.client.rpc("register_guest_player", { p_guest_id: state.player.id, p_edit_token: state.player.editToken, p_display_name: state.player.displayName });
          if (error) throw error;
          localStorage.setItem(LOCAL_PLAYER_KEY, JSON.stringify(state.player));
          renderIdentity();
          await Promise.all([loadMatches(), loadLeaderboard()]);
          setMessage(t("nameSaved"), "success");
        } catch (error) {
          state.player = current; setMessage(error.message || "Could not save name.", "error");
        } finally {
          setBusy(els.continueButton, false, t("continue"));
        }
      }

      function loadPlayer() {
        try {
          const player = JSON.parse(localStorage.getItem(LOCAL_PLAYER_KEY) || "null");
          if (player?.id && player?.editToken && player?.displayName && isAllowedPlayerName(player.displayName)) return player;
          localStorage.removeItem(LOCAL_PLAYER_KEY);
          return null;
        } catch { return null; }
      }

      function showNameForm() {
        clearMessage(); clearAuthError(); els.authPanel.classList.remove("hide"); els.nameInput.value = state.player?.displayName || ""; window.setTimeout(() => els.nameInput.focus(), 0);
      }

      function renderIdentity() {
        if (!state.player) { els.authPanel.classList.remove("hide"); els.signOutButton.classList.add("hide"); els.userLabel.textContent = "No name"; return; }
        els.authPanel.classList.add("hide"); els.signOutButton.classList.remove("hide"); els.userLabel.textContent = state.player.displayName;
      }

      function renderNavigation() {
        els.mainNav.innerHTML = PAGES.map((page) => `<button class="nav-button ${state.activePage === page ? "active" : ""}" type="button" data-page="${page}">${escapeHtml(t(page))}</button>`).join("");
      }

      function renderApp() {
        applyLanguage(); renderNavigation(); renderIdentity(); clearCountdownTimer();
        const renderers = { home:renderHomePage, schedule:renderSchedulePage, leaderboard:renderLeaderboardPage, groups:renderGroupsPage, bracket:renderBracketPage, dashboard:renderDashboardPage, admin:renderAdminPage };
        els.pageRoot.innerHTML = (renderers[state.activePage] || renderHomePage)();
        resetCountdownTimer();
      }

      function renderHomePage() {
        const next = nextMatch();
        const stats = appStats();
        const upcomingPreview = state.matches.filter(isFutureScheduledMatch).slice(0, 5);
        return `
          <section class="hero">
            <div class="hero-card">
              <div><div class="brand-mark">USA · Canada · Mexico</div><h2>${escapeHtml(t("appTitle"))}</h2><p>${escapeHtml(t("appSubtitle"))}</p></div>
              <div class="hero-actions"><button type="button" data-page="schedule">${escapeHtml(t("predictNow"))}</button><button class="secondary" type="button" data-page="schedule">${escapeHtml(t("viewSchedule"))}</button><button class="secondary" type="button" data-page="leaderboard">${escapeHtml(t("viewLeaderboard"))}</button></div>
            </div>
            <div class="panel"><div class="panel-header"><div class="panel-title"><h2>${escapeHtml(t("nextMatch"))}</h2><span>${escapeHtml(t("localTime"))}: ${escapeHtml(DATE_TIME_ZONE)}</span></div></div><div class="panel-body">${next ? renderMatchCard(next) : empty(t("noNextMatch"))}</div></div>
          </section>
          <section class="stat-grid" style="margin-top:16px;">${renderStat(t("totalPredictions"), stats.predictions)}${renderStat(t("matchesPlayed"), stats.finished)}${renderStat(t("topPredictor"), stats.top)}${renderStat(t("openMatches"), stats.open)}</section>
          <section class="grid-2" style="margin-top:16px;"><div class="panel"><div class="panel-header"><div class="panel-title"><h2>${escapeHtml(t("schedule"))}</h2><span>${escapeHtml(t("upcoming"))}</span></div></div><div class="panel-body match-list">${upcomingPreview.map(renderMatchCard).join("") || empty(t("noMatches"))}</div></div><div class="panel"><div class="panel-header"><div class="panel-title"><h2>${escapeHtml(t("leaderboard"))}</h2><span>${escapeHtml(t("points"))}</span></div></div><div class="panel-body">${renderLeaderboardRows(state.leaderboard.slice(0,6))}</div></div></section>
        `;
      }

      function renderSchedulePage() {
        const matches = filteredMatches();
        return `<section class="panel"><div class="panel-header"><div class="panel-title"><h2>${escapeHtml(t("schedule"))}</h2><span>${matches.length} / ${state.matches.length || 0} ${escapeHtml(t("match"))} · ${escapeHtml(DATE_TIME_ZONE)}</span></div></div><div class="panel-body stack">${renderFilters()}<div class="match-list">${renderGroupedMatches(matches)}</div></div></section>`;
      }

      function renderFilters() {
        const dates = Array.from(new Set(state.matches.map((match) => localDateKey(new Date(match.utc_date))))).sort();
        return `<div class="toolbar">
          <input data-filter="search" value="${escapeAttribute(state.filters.search)}" placeholder="${escapeAttribute(t("search"))}">
          <select data-filter="group"><option value="all">${escapeHtml(t("allGroups"))}</option>${GROUP_ORDER.map((group) => `<option value="${group}" ${state.filters.group === group ? "selected" : ""}>${escapeHtml(t("group"))} ${group}</option>`).join("")}</select>
          <select data-filter="status">${[["all",t("allStatuses")],["upcoming",t("upcoming")],["live",t("live")],["finished",t("finished")]].map(([v,l]) => `<option value="${v}" ${state.filters.status === v ? "selected" : ""}>${escapeHtml(l)}</option>`).join("")}</select>
          <select data-filter="stage">${[["all",t("allStages")],["group",t("groups")],["knockout",t("bracket")]].map(([v,l]) => `<option value="${v}" ${state.filters.stage === v ? "selected" : ""}>${escapeHtml(l)}</option>`).join("")}</select>
          <select data-filter="date"><option value="all">${escapeHtml(t("allDates"))}</option>${dates.map((date) => `<option value="${date}" ${state.filters.date === date ? "selected" : ""}>${escapeHtml(formatDateHeading(date))}</option>`).join("")}</select>
        </div>`;
      }

      function renderGroupedMatches(matches) {
        if (!matches.length) return empty(t("noMatches"));
        const groups = new Map();
        matches.forEach((match) => { const key = localDateKey(new Date(match.utc_date)); if (!groups.has(key)) groups.set(key, []); groups.get(key).push(match); });
        return Array.from(groups.entries()).map(([date, dayMatches]) => `<section class="date-section"><div class="date-heading"><h3>${escapeHtml(formatDateHeading(date))}</h3><span>${dayMatches.length} ${escapeHtml(t("match"))}</span></div>${dayMatches.map(renderMatchCard).join("")}</section>`).join("");
      }

      function renderMatchCard(match) {
        const isOpen = isPredictionOpen(match), finished = isFinishedMatch(match), live = isLiveMatch(match), kickoff = new Date(match.utc_date);
        const scoreText = hasFinalScore(match) ? `${Number(match.score_home)} - ${Number(match.score_away)}` : "vs";
        const statusClass = isOpen ? "open" : live ? "live" : finished ? "finished" : "";
        const statusText = isOpen ? t("upcoming") : live ? t("live") : finished ? t("finished") : t("locked");
        const venue = [match.stadium, match.city, match.country].filter(Boolean).join(" · ") || match.raw?.venue || match.raw?.stadium || match.raw?.area?.name || t("tbd");
        return `<article class="match-card" data-match-card="${escapeAttribute(match.football_data_id)}">
          <div class="match-top"><span>#${escapeHtml(match.match_number || match.matchday || "-")} · ${escapeHtml(stageLabel(match))}</span><span>${escapeHtml(formatDateTime(kickoff))}</span></div>
          <div class="match-main">${renderTeam(match.home_team_name, match.home_team_tla, "home")}<div class="score-box"><div class="score-line">${escapeHtml(scoreText)}</div><div class="status ${statusClass}">${escapeHtml(statusText)}</div>${isFutureScheduledMatch(match) ? `<div class="countdown" data-countdown="${escapeAttribute(match.football_data_id)}" data-kickoff-ms="${kickoff.getTime()}">${escapeHtml(formatCountdown(kickoff.getTime() - Date.now()))}</div>` : ""}</div>${renderTeam(match.away_team_name, match.away_team_tla, "away")}</div>
          <div class="muted">${escapeHtml(t("group"))} ${escapeHtml(extractGroup(match) || "-")} · ${escapeHtml(venue)}</div>
          ${isOpen ? renderPredictionForm(match) : renderMatchDetails(match)}
        </article>`;
      }

      function renderTeam(name, tla, side) {
        const main = localizedTeamName(name), alt = state.lang === "ar" ? name || "TBD" : teamMeta[name]?.[0] || tla || "";
        const flag = `<div class="flag-badge">${escapeHtml(teamFlag(name))}</div>`;
        const text = `<div><div class="team-name">${escapeHtml(main)}</div><div class="team-alt">${escapeHtml(alt || tla || "")}</div></div>`;
        return `<div class="team ${side === "away" ? "away" : ""}">${side === "away" ? text + flag : flag + text}</div>`;
      }

      function renderPredictionForm(match) {
        const p = match.prediction, id = escapeAttribute(match.football_data_id);
        return `<div class="prediction-row"><input data-home-score="${id}" type="number" min="0" max="99" step="1" inputmode="numeric" placeholder="0" value="${escapeAttribute(p?.home_score ?? "")}"><span class="muted" style="text-align:center;font-weight:900;">-</span><input data-away-score="${id}" type="number" min="0" max="99" step="1" inputmode="numeric" placeholder="0" value="${escapeAttribute(p?.away_score ?? "")}"><button type="button" data-save-match="${id}">${escapeHtml(t("save"))}</button><div class="prediction-note">${p ? `${escapeHtml(t("yourPrediction"))}: ${escapeHtml(formatPrediction(p))} · ` : ""}${escapeHtml(predictionLockReason(match))}<button class="secondary" style="margin-inline-start:8px;min-height:30px;" type="button" data-open-match="${id}">${escapeHtml(t("match"))}</button></div></div>`;
      }

      function renderMatchDetails(match) {
        const finished = isFinishedMatch(match), p = match.prediction;
        return `<div class="detail-grid"><div class="detail-box"><div class="detail-label">${escapeHtml(finished ? t("finalScore") : t("status"))}</div><div class="detail-value">${escapeHtml(finished && hasFinalScore(match) ? `${Number(match.score_home)} - ${Number(match.score_away)}` : predictionLockReason(match))}</div></div><div class="detail-box"><div class="detail-label">${escapeHtml(t("yourPrediction"))}</div><div class="detail-value">${escapeHtml(p ? formatPrediction(p) : t("noPrediction"))}</div></div><div class="detail-box"><div class="detail-label">${escapeHtml(finished ? t("pointsGained") : t("match"))}</div><div class="detail-value">${escapeHtml(finished ? p?.points ?? 0 : stageLabel(match))}</div></div></div>`;
      }

      function renderLeaderboardPage() {
        return `<section class="panel"><div class="panel-header"><div class="panel-title"><h2>${escapeHtml(t("leaderboard"))}</h2><span>${escapeHtml(t("points"))} · ${escapeHtml(t("exact"))} · ${escapeHtml(t("outcome"))}</span></div></div><div class="panel-body">${renderLeaderboardRows(state.leaderboard)}</div></section>`;
      }

      function renderLeaderboardRows(rows) {
        if (!rows.length) return empty(t("noRows"));
        return rows.map((row, index) => { const medal = index === 0 ? "🥇" : index === 1 ? "🥈" : index === 2 ? "🥉" : index + 1; const acc = row.predictions_count ? Math.round(((row.exact_scores + row.correct_outcomes) / row.predictions_count) * 100) : 0; return `<div class="leader-row"><div class="rank">${escapeHtml(medal)}</div><div><div class="leader-name">${escapeHtml(row.display_name || "Player")}</div><div class="leader-meta">${row.predictions_count} ${escapeHtml(t("predictions"))} · ${row.exact_scores} ${escapeHtml(t("exact"))} · ${row.correct_outcomes} ${escapeHtml(t("outcome"))} · ${acc}%</div></div><div class="points">${escapeHtml(row.total_points ?? 0)}</div></div>`; }).join("");
      }

      function renderGroupsPage() {
        const standings = computeGroupStandings();
        return `<section class="panel"><div class="panel-header"><div class="panel-title"><h2>${escapeHtml(t("groupStandings"))}</h2><span>12 ${escapeHtml(t("groups"))} · top 2 + best third-place teams</span></div></div><div class="panel-body groups-grid">${GROUP_ORDER.map((group) => renderGroupTable(group, standings[group] || [])).join("")}</div></section>`;
      }

      function renderGroupTable(group, rows) {
        return `<div class="card" style="padding:12px;"><h3 style="margin:0 0 8px;color:var(--gold);">${escapeHtml(t("group"))} ${group}</h3><table><thead><tr><th>#</th><th>${escapeHtml(t("match"))}</th><th>P</th><th>GD</th><th>Pts</th></tr></thead><tbody>${rows.map((row, i) => `<tr class="${i < 2 ? "qualified" : i === 2 ? "third-place" : ""}"><td>${i + 1}</td><td>${escapeHtml(teamFlag(row.team))} ${escapeHtml(localizedTeamName(row.team))}</td><td>${row.played}</td><td>${row.goalDifference}</td><td>${row.points}</td></tr>`).join("")}</tbody></table></div>`;
      }

      function renderBracketPage() {
        const rounds = [["Round of 32","Jun 28 - Jul 3",16],["Round of 16","Jul 4 - 7",8],["Quarterfinals","Jul 9 - 11",4],["Semifinals","Jul 14 - 15",2],["Third Place","Jul 18",1],["Final","Jul 19",1]];
        const knockout = state.matches.filter((m) => !isGroupStage(m));
        return `<section class="panel"><div class="panel-header"><div class="panel-title"><h2>${escapeHtml(t("bracket"))}</h2><span>Round of 32 → Final · ${escapeHtml(t("tbd"))} until group results are known</span></div></div><div class="panel-body bracket">${rounds.map(([n,d,c]) => renderBracketRound(n,d,Number(c),knockout)).join("")}</div></section>`;
      }

      function renderBracketRound(name, date, count, knockout) {
        const roundMatches = knockout.filter((m) => normalizeStage(m.stage).includes(normalizeStage(name)));
        const matches = roundMatches.length ? roundMatches : Array.from({ length: count }, (_, index) => ({ placeholder:true, index }));
        return `<div class="round"><h3>${escapeHtml(name)}</h3><div class="muted">${escapeHtml(date)}</div>${matches.map((m,i) => `<div class="bracket-match">${m.placeholder ? `${escapeHtml(t("match"))} ${i + 1}<br><strong>${escapeHtml(t("tbd"))}</strong> vs <strong>${escapeHtml(t("tbd"))}</strong>` : `${escapeHtml(formatDateTime(new Date(m.utc_date)))}<br><strong>${escapeHtml(localizedTeamName(m.home_team_name))}</strong> vs <strong>${escapeHtml(localizedTeamName(m.away_team_name))}</strong>`}</div>`).join("")}</div>`;
      }

      function renderDashboardPage() {
        if (!state.player) return `<section class="panel"><div class="empty">${escapeHtml(t("enterNameToPredict"))}</div></section>`;
        const predicted = state.matches.filter((m) => m.prediction), finished = state.matches.filter((m) => isFinishedMatch(m) && m.prediction);
        const totalPoints = predicted.reduce((sum, m) => sum + Number(m.prediction?.points ?? 0), 0);
        const exact = predicted.filter((m) => Number(m.prediction?.points) === 2).length, outcome = predicted.filter((m) => Number(m.prediction?.points) === 1).length;
        const missing = state.matches.filter((m) => isFutureScheduledMatch(m) && !m.prediction).slice(0,8);
        return `<section class="stat-grid">${renderStat(t("myPredictions"), `${predicted.length}/${state.matches.length || 0}`)}${renderStat(t("points"), totalPoints)}${renderStat(t("exact"), exact)}${renderStat(t("outcome"), outcome)}</section><section class="grid-2" style="margin-top:16px;"><div class="panel"><div class="panel-header"><div class="panel-title"><h2>${escapeHtml(t("missingPredictions"))}</h2></div></div><div class="panel-body match-list">${missing.map(renderMatchCard).join("") || empty(t("noRows"))}</div></div><div class="panel"><div class="panel-header"><div class="panel-title"><h2>${escapeHtml(t("recentResults"))}</h2></div></div><div class="panel-body match-list">${finished.slice(0,8).map(renderMatchCard).join("") || empty(t("noRows"))}</div></div></section>`;
      }

      function renderAdminPage() {
        return `<section class="panel"><div class="panel-header"><div class="panel-title"><h2>${escapeHtml(t("adminTools"))}</h2><span>${escapeHtml(t("adminNote"))}</span></div></div><div class="panel-body stack"><button type="button" data-fetch-results>${escapeHtml(t("fetchResults"))}</button><div class="muted">This keeps your existing admin flow: enter the admin PIN, call the existing Edge Function, upsert official matches, then recalculate points.</div></div></section>`;
      }

      function handleClick(event) {
        const page = event.target.closest("[data-page]"); if (page) { state.activePage = page.dataset.page; renderApp(); return; }
        const save = event.target.closest("[data-save-match]"); if (save) { savePrediction(save.dataset.saveMatch); return; }
        const open = event.target.closest("[data-open-match]"); if (open) { openPredictionModal(open.dataset.openMatch); return; }
        const fetch = event.target.closest("[data-fetch-results]"); if (fetch) fetchOfficialResults(fetch);
      }

      function handleInput(event) {
        const field = event.target.closest("[data-filter]"); if (!field) return;
        state.filters[field.dataset.filter] = field.value; renderApp();
      }

      function openPredictionModal(matchId) {
        const match = state.matches.find((item) => String(item.football_data_id) === String(matchId)); if (!match) return;
        state.activeMatchId = matchId; els.modalTitle.textContent = `${localizedTeamName(match.home_team_name)} vs ${localizedTeamName(match.away_team_name)}`; els.modalSubtitle.textContent = formatDateTime(new Date(match.utc_date)); els.modalBody.innerHTML = renderMatchCard(match); els.predictionModal.classList.add("show");
      }

      function closePredictionModal() { state.activeMatchId = null; els.predictionModal.classList.remove("show"); els.modalBody.innerHTML = ""; }

      async function savePrediction(matchId) {
        clearMessage();
        if (!state.player) { setMessage(t("enterNameFirst"), "error"); showNameForm(); return; }
        const match = state.matches.find((item) => String(item.football_data_id) === String(matchId));
        if (!match || !isPredictionOpen(match)) { setMessage(t("lockedMatch"), "error"); await loadMatches(); return; }
        const homeScore = readScore(document.querySelector(`[data-home-score="${matchId}"]`));
        const awayScore = readScore(document.querySelector(`[data-away-score="${matchId}"]`));
        if (homeScore === null || awayScore === null) { setMessage(t("invalidScore"), "error"); return; }
        const buttons = document.querySelectorAll(`[data-save-match="${matchId}"]`); buttons.forEach((button) => setBusy(button, true, t("saving")));
        try {
          const { error } = await state.client.rpc("save_guest_prediction", { p_guest_id: state.player.id, p_edit_token: state.player.editToken, p_display_name: state.player.displayName, p_match_id: Number(matchId), p_home_score: homeScore, p_away_score: awayScore });
          if (error) throw error;
          setMessage(t("predictionSaved"), "success");
          await Promise.all([loadMatches(), loadLeaderboard()]);
          if (state.activeMatchId) openPredictionModal(state.activeMatchId);
        } catch (error) {
          setMessage(error.message || "Could not save prediction.", "error"); await loadMatches();
        } finally {
          buttons.forEach((button) => setBusy(button, false, t("save")));
        }
      }

      async function fetchOfficialResults(button) {
        clearMessage();
        const adminPin = window.prompt("Admin PIN"); if (!adminPin) return;
        setBusy(button, true, t("saving"));
        try {
          const { data, error } = await state.client.functions.invoke("fetch-matches", { body: { season: WORLD_CUP_SEASON }, headers: { "x-admin-pin": adminPin } });
          if (error) throw error;
          setMessage(`Official results refreshed. ${data?.upserted ?? 0} matches upserted.`, "success");
          await Promise.all([loadMatches(), loadLeaderboard()]);
        } catch (error) {
          setMessage(error.message || "Could not fetch official results.", "error");
        } finally { setBusy(button, false, t("fetchResults")); }
      }

      function filteredMatches() {
        return state.matches.filter((m) => {
          const group = extractGroup(m), status = statusGroup(m), stage = isGroupStage(m) ? "group" : "knockout", date = localDateKey(new Date(m.utc_date));
          const search = state.filters.search.trim().toLowerCase();
          const names = `${m.home_team_name} ${m.away_team_name} ${localizedTeamName(m.home_team_name)} ${localizedTeamName(m.away_team_name)}`.toLowerCase();
          return (state.filters.group === "all" || group === state.filters.group) && (state.filters.status === "all" || status === state.filters.status) && (state.filters.stage === "all" || stage === state.filters.stage) && (state.filters.date === "all" || date === state.filters.date) && (!search || names.includes(search));
        });
      }

      function computeGroupStandings() {
        const standings = {};
        GROUP_ORDER.forEach((g) => standings[g] = groupTeams[g].map((team) => ({ team, played:0, goalsFor:0, goalsAgainst:0, goalDifference:0, points:0 })));
        state.matches.filter((m) => isGroupStage(m) && isFinishedMatch(m) && hasFinalScore(m)).forEach((m) => {
          const g = extractGroup(m); if (!g || !standings[g]) return;
          const h = getStandingRow(standings[g], m.home_team_name), a = getStandingRow(standings[g], m.away_team_name); if (!h || !a) return;
          const hs = Number(m.score_home), as = Number(m.score_away); h.played++; a.played++; h.goalsFor += hs; h.goalsAgainst += as; a.goalsFor += as; a.goalsAgainst += hs;
          if (hs > as) h.points += 3; else if (hs < as) a.points += 3; else { h.points++; a.points++; }
          h.goalDifference = h.goalsFor - h.goalsAgainst; a.goalDifference = a.goalsFor - a.goalsAgainst;
        });
        Object.keys(standings).forEach((g) => standings[g].sort((a,b) => b.points - a.points || b.goalDifference - a.goalDifference || b.goalsFor - a.goalsFor || localizedTeamName(a.team).localeCompare(localizedTeamName(b.team))));
        return standings;
      }

      function getStandingRow(rows, name) { const n = normalizeTeam(name); return rows.find((r) => normalizeTeam(r.team) === n); }
      function appStats() { return { predictions: state.leaderboard.reduce((s,r) => s + Number(r.predictions_count ?? 0), 0), finished: state.matches.filter(isFinishedMatch).length, open: state.matches.filter(isFutureScheduledMatch).length, top: state.leaderboard[0]?.display_name || "-" }; }
      function nextMatch() { return state.matches.find(isFutureScheduledMatch) || null; }
      function isPredictionOpen(m) {
        return Boolean(
          state.player &&
          isOpenPredictionStatus(m.status) &&
          new Date(m.utc_date).getTime() > Date.now()
        );
      }
      function isFutureScheduledMatch(m) {
        return isOpenPredictionStatus(m.status) && new Date(m.utc_date).getTime() > Date.now();
      }
      function isLiveMatch(m) { return ["IN_PLAY","PAUSED","EXTRA_TIME","PENALTY_SHOOTOUT"].includes(String(m.status || "").toUpperCase()); }
      function isFinishedMatch(m) { return hasFinalScore(m) || ["FINISHED","FULL_TIME","AWARDED"].includes(String(m.status || "").toUpperCase()); }
      function hasFinalScore(m) { return isScoreValue(m.score_home) && isScoreValue(m.score_away); }
      function isScoreValue(v) { return v !== null && v !== undefined && v !== "" && Number.isFinite(Number(v)); }
      function statusGroup(m) { if (isLiveMatch(m)) return "live"; if (isFinishedMatch(m)) return "finished"; return "upcoming"; }
      function predictionLockReason(m) { if (!state.player) return t("enterNameToPredict"); if (!isOpenPredictionStatus(m.status)) return t("lockedByStatus"); if (new Date(m.utc_date).getTime() <= Date.now()) return t("lockedAfterKickoff"); return t("openUntilKickoff"); }
      function isGroupStage(m) { const stage = normalizeStage(m.stage); return Boolean(extractGroup(m)) || stage.includes("group"); }
      function extractGroup(m) { const raw = String(m.group_name || "").toUpperCase(); return raw.match(/[A-L]$/)?.[0] || raw.match(/GROUP_?([A-L])/)?.[1] || teamMeta[m.home_team_name]?.[2] || null; }
      function stageLabel(m) { return isGroupStage(m) ? `${t("group")} ${extractGroup(m) || ""}`.trim() : String(m.stage || t("bracket")).replaceAll("_", " "); }
      function normalizeStage(v) { return String(v || "").toLowerCase().replaceAll("_", " ").replace(/[^a-z0-9 ]/g, "").trim(); }
      function isOpenPredictionStatus(status) { return ["SCHEDULED", "TIMED"].includes(String(status || "").toUpperCase()); }
      function localizedTeamName(name) { if (!name || name === "TBD") return t("tbd"); return state.lang === "ar" ? teamMeta[name]?.[0] || name : name; }
      function teamFlag(name) { return teamMeta[name]?.[1] || "⚽"; }
      function normalizeTeam(name) { return String(name || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/\bturkey\b/g, "turkiye").replace(/\busa\b/g, "united states").replace(/\bcote d'ivoire\b/g, "ivory coast").replace(/[^a-z0-9]+/g, " ").trim(); }
      function formatPrediction(p) { return `${Number(p.home_score)} - ${Number(p.away_score)}`; }
      function readScore(input) { const v = input?.value.trim() ?? ""; if (!/^\d{1,2}$/.test(v)) return null; const n = Number(v); return Number.isInteger(n) && n >= 0 && n <= 99 ? n : null; }
      function normalizeAllowedPlayerName(name) { return String(name ?? "").trim().toLocaleLowerCase("ar"); }
      function isAllowedPlayerName(name) { return ALLOWED_PLAYER_NAME_SET.has(normalizeAllowedPlayerName(name)); }
      function normalizeDisplayName(v) { const name = String(v ?? "").replace(/\s+/g, " ").trim(); return name.length >= 2 && name.length <= 40 ? name : ""; }
      function randomToken() { const bytes = new Uint8Array(32); crypto.getRandomValues(bytes); return Array.from(bytes, (b) => b.toString(16).padStart(2, "0")).join(""); }

      function resetCountdownTimer() { clearCountdownTimer(); const expired = updateCountdowns(); if (expired) return; if (document.querySelector("[data-countdown]")) state.countdownTimer = window.setInterval(updateCountdowns, 1000); }
      function clearCountdownTimer() { if (!state.countdownTimer) return; window.clearInterval(state.countdownTimer); state.countdownTimer = null; }
      function updateCountdowns() { const nodes = Array.from(document.querySelectorAll("[data-countdown]")); let expired = false; nodes.forEach((node) => { const ms = Number(node.dataset.kickoffMs) - Date.now(); if (!Number.isFinite(ms) || ms <= 0) { expired = true; node.textContent = t("lockedAfterKickoff"); return; } node.textContent = formatCountdown(ms); }); if (expired) renderApp(); return expired; }
      function formatCountdown(ms) { const total = Math.max(0, Math.floor(ms / 1000)), d = Math.floor(total / 86400), h = Math.floor((total % 86400) / 3600), m = Math.floor((total % 3600) / 60), s = total % 60; return `${t("startsIn")} ${d ? `${d}d ` : ""}${h}h ${m}m ${s}s`; }
      function localDateKey(date) { return new Intl.DateTimeFormat("en-CA", { timeZone: DATE_TIME_ZONE, year:"numeric", month:"2-digit", day:"2-digit" }).format(date); }
      function formatDateHeading(key) { const today = localDateKey(new Date()); if (key === today) return t("today"); if (key === shiftDateKey(today, 1)) return t("tomorrow"); const [y,m,d] = key.split("-").map(Number); return new Intl.DateTimeFormat(state.lang === "ar" ? "ar" : "en-GB", { timeZone:"UTC", weekday:"long", day:"numeric", month:"long" }).format(new Date(Date.UTC(y, m - 1, d, 12))).replace(",", ""); }
      function shiftDateKey(key, days) { const [y,m,d] = key.split("-").map(Number), dt = new Date(Date.UTC(y, m - 1, d + days, 12)); return `${dt.getUTCFullYear()}-${String(dt.getUTCMonth()+1).padStart(2,"0")}-${String(dt.getUTCDate()).padStart(2,"0")}`; }
      function formatDateTime(date) { return new Intl.DateTimeFormat(state.lang === "ar" ? "ar" : "en", { timeZone: DATE_TIME_ZONE, weekday:"short", month:"short", day:"numeric", hour:"2-digit", minute:"2-digit" }).format(date); }

      function renderStat(label, value) { return `<div class="stat"><div class="stat-label">${escapeHtml(label)}</div><div class="stat-value">${escapeHtml(value)}</div></div>`; }
      function empty(message) { return `<div class="empty">${escapeHtml(message)}</div>`; }
      function setBusy(button, busy, label) { if (!button) return; button.disabled = busy; button.textContent = label; }
      function setAuthError(message) { els.authError.textContent = message; els.authError.classList.add("show"); }
      function clearAuthError() { els.authError.textContent = ""; els.authError.classList.remove("show"); }
      function setMessage(message, type = "") { els.globalMessage.textContent = message; els.globalMessage.className = `message show ${type}`.trim(); }
      function clearMessage() { els.globalMessage.textContent = ""; els.globalMessage.className = "message"; }
      function toggleLanguage() { state.lang = state.lang === "ar" ? "en" : "ar"; localStorage.setItem(LOCAL_LANG_KEY, state.lang); renderApp(); }
      function applyLanguage() { document.documentElement.lang = state.lang; document.documentElement.dir = state.lang === "ar" ? "rtl" : "ltr"; document.body.dir = document.documentElement.dir; els.languageButton.textContent = state.lang === "ar" ? "English" : "العربية"; document.querySelectorAll("[data-i18n]").forEach((n) => { n.textContent = t(n.dataset.i18n); }); els.nameInput.placeholder = state.lang === "ar" ? "اسم العرض" : "Your display name"; }
      function t(key) { return translations[state.lang]?.[key] || translations.en[key] || key; }
      function escapeHtml(value) { return String(value ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;"); }
      function escapeAttribute(value) { return escapeHtml(value); }
    </script>
  </body>
</html>
