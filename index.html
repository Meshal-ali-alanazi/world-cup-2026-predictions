<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>World Cup 2026 Predictions</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7f4;
        --panel: #ffffff;
        --panel-soft: #eef4ed;
        --text: #17201b;
        --muted: #65716a;
        --line: #d9e0db;
        --accent: #0f7b63;
        --accent-dark: #0b5948;
        --danger: #bb3d2b;
        --warning: #a66a00;
        --shadow: 0 16px 40px rgba(22, 30, 26, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(180deg, rgba(15, 123, 99, 0.10), transparent 360px),
          var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button,
      input {
        font: inherit;
      }

      button {
        border: 0;
        border-radius: 6px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        font-weight: 700;
        min-height: 42px;
        padding: 0 16px;
        transition: background 0.16s ease, transform 0.16s ease;
      }

      button:hover:not(:disabled) {
        background: var(--accent-dark);
        transform: translateY(-1px);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.54;
      }

      button.secondary {
        background: #e7ece8;
        color: var(--text);
      }

      button.secondary:hover:not(:disabled) {
        background: #d8e1db;
      }

      button.danger {
        background: var(--danger);
      }

      input {
        width: 100%;
        min-height: 42px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        color: var(--text);
        padding: 0 12px;
        outline: none;
      }

      input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(15, 123, 99, 0.14);
      }

      input:disabled {
        background: #f1f3f1;
        color: var(--muted);
      }

      .shell {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
        padding: 28px 0 48px;
      }

      .topbar {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 20px;
        align-items: center;
        padding-bottom: 24px;
      }

      .brand {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .brand h1 {
        margin: 0;
        font-size: clamp(30px, 4vw, 52px);
        line-height: 1;
        letter-spacing: 0;
      }

      .brand p {
        margin: 0;
        color: var(--muted);
        font-size: 15px;
      }

      .session {
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: flex-end;
        flex-wrap: wrap;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        min-height: 34px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.72);
        color: var(--muted);
        padding: 0 12px;
        font-size: 13px;
        font-weight: 700;
      }

      .grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 360px;
        gap: 20px;
        align-items: start;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        border-bottom: 1px solid var(--line);
        padding: 18px;
      }

      .tournament-header {
        align-items: flex-end;
        flex-wrap: wrap;
      }

      .panel-title {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .panel-title h2 {
        margin: 0;
        font-size: 18px;
      }

      .panel-title span {
        color: var(--muted);
        font-size: 13px;
      }

      .message {
        display: none;
        margin-bottom: 16px;
        border-radius: 8px;
        padding: 12px 14px;
        background: var(--panel-soft);
        color: var(--text);
        border: 1px solid var(--line);
        font-size: 14px;
      }

      .message.show {
        display: block;
      }

      .message.error {
        background: #fff0ed;
        border-color: #f0c1b8;
        color: #7d2619;
      }

      .message.success {
        background: #edf8f1;
        border-color: #bde3ca;
        color: #174f2a;
      }

      .auth-box {
        display: grid;
        grid-template-columns: minmax(220px, 1fr) auto;
        gap: 10px;
        padding: 18px;
      }

      .filter-tabs {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .filter-tab {
        min-height: 36px;
        border: 1px solid var(--line);
        background: #f7f9f7;
        color: var(--muted);
        padding: 0 12px;
        font-size: 13px;
      }

      .filter-tab:hover:not(:disabled) {
        background: #e7ece8;
        color: var(--text);
      }

      .filter-tab.active {
        border-color: rgba(15, 123, 99, 0.30);
        background: var(--accent);
        color: #fff;
      }

      .matches {
        display: flex;
        flex-direction: column;
        gap: 18px;
        padding: 16px;
      }

      .match-date-section {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .date-heading {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        color: var(--text);
      }

      .date-heading h3 {
        margin: 0;
        font-size: 16px;
      }

      .date-heading span {
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
      }

      .match-card {
        border: 1px solid var(--line);
        border-radius: 8px;
        background:
          linear-gradient(180deg, rgba(238, 244, 237, 0.58), transparent 120px),
          #fff;
        padding: 16px;
        box-shadow: 0 10px 24px rgba(22, 30, 26, 0.05);
      }

      .match-main {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 14px;
        align-items: center;
      }

      .team {
        display: grid;
        grid-template-columns: 42px minmax(0, 1fr);
        gap: 10px;
        align-items: center;
      }

      .team.away {
        grid-template-columns: minmax(0, 1fr) 42px;
        text-align: right;
      }

      .crest {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: 1px solid var(--line);
        background: #f3f5f3;
        display: grid;
        place-items: center;
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
        overflow: hidden;
      }

      .crest img {
        width: 34px;
        height: 34px;
        object-fit: contain;
      }

      .team-name {
        min-width: 0;
        display: flex;
        gap: 8px;
        align-items: center;
        font-weight: 800;
        overflow-wrap: anywhere;
      }

      .team.away .team-name {
        justify-content: flex-end;
      }

      .team-flag {
        flex: 0 0 auto;
        font-size: 18px;
        line-height: 1;
      }

      .team-code {
        margin-top: 2px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .score-box {
        min-width: 150px;
        text-align: center;
      }

      .kickoff {
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        margin-bottom: 6px;
      }

      .score-line {
        font-size: 26px;
        font-weight: 900;
        line-height: 1;
      }

      .score-line.final {
        font-size: 30px;
      }

      .status {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        margin-top: 8px;
        padding: 0 8px;
        border-radius: 999px;
        background: #e8efeb;
        color: var(--muted);
        font-size: 11px;
        font-weight: 900;
      }

      .status.open {
        background: #e2f4ea;
        color: #126238;
      }

      .status.locked {
        background: #fff2de;
        color: var(--warning);
      }

      .status.finished {
        background: #e9edf8;
        color: #254887;
      }

      .countdown {
        margin-top: 8px;
        color: var(--accent-dark);
        font-size: 12px;
        font-weight: 900;
      }

      .prediction-row {
        display: grid;
        grid-template-columns: 74px 18px 74px auto;
        gap: 10px;
        align-items: center;
        margin-top: 14px;
        border-top: 1px solid var(--line);
        padding-top: 14px;
      }

      .prediction-row input {
        text-align: center;
        font-weight: 800;
      }

      .dash {
        color: var(--muted);
        font-weight: 900;
        text-align: center;
      }

      .prediction-note {
        grid-column: 1 / -1;
        color: var(--muted);
        font-size: 12px;
      }

      .match-details {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        margin-top: 14px;
        border-top: 1px solid var(--line);
        padding-top: 14px;
      }

      .detail-box {
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.76);
        padding: 10px;
      }

      .detail-label {
        color: var(--muted);
        font-size: 11px;
        font-weight: 900;
        text-transform: uppercase;
      }

      .detail-value {
        margin-top: 4px;
        font-size: 15px;
        font-weight: 900;
      }

      .detail-value.points-value {
        color: var(--accent-dark);
        font-size: 20px;
      }

      .leaderboard-list {
        padding: 8px 14px 14px;
      }

      .leader-row {
        display: grid;
        grid-template-columns: 34px 1fr auto;
        gap: 10px;
        align-items: center;
        padding: 10px 0;
        border-bottom: 1px solid var(--line);
      }

      .leader-row:last-child {
        border-bottom: 0;
      }

      .rank {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: #e8efeb;
        color: var(--muted);
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 900;
      }

      .leader-name {
        font-weight: 800;
        overflow-wrap: anywhere;
      }

      .leader-meta {
        color: var(--muted);
        font-size: 12px;
        margin-top: 2px;
      }

      .points {
        font-size: 18px;
        font-weight: 900;
      }

      .admin {
        display: none;
        border-top: 1px solid var(--line);
        padding: 14px;
      }

      .admin.show {
        display: block;
      }

      .empty,
      .loading {
        padding: 22px;
        color: var(--muted);
        text-align: center;
      }

      .hide {
        display: none !important;
      }

      @media (max-width: 900px) {
        .topbar,
        .grid {
          grid-template-columns: 1fr;
        }

        .session {
          justify-content: flex-start;
        }

        .filter-tabs {
          justify-content: flex-start;
        }
      }

      @media (max-width: 640px) {
        .shell {
          width: min(100% - 20px, 1180px);
          padding-top: 18px;
        }

        .panel-header,
        .auth-box {
          grid-template-columns: 1fr;
        }

        .match-main {
          grid-template-columns: 1fr;
        }

        .team.away {
          grid-template-columns: 42px minmax(0, 1fr);
          text-align: left;
        }

        .team.away .team-name {
          justify-content: flex-start;
        }

        .team.away .crest {
          grid-column: 1;
          grid-row: 1;
        }

        .team.away > div:not(.crest) {
          grid-column: 2;
        }

        .score-box {
          min-width: 0;
          order: -1;
        }

        .prediction-row {
          grid-template-columns: 1fr 18px 1fr;
        }

        .prediction-row button {
          grid-column: 1 / -1;
        }

        .match-details {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand">
          <h1>World Cup 2026 Predictions</h1>
          <p id="dateLabel">Today in Mecca time</p>
        </div>
        <div class="session">
          <span id="realtimeStatus" class="pill">Realtime idle</span>
          <span id="userLabel" class="pill">No name</span>
          <button id="refreshButton" class="secondary" type="button">Refresh</button>
          <button id="signOutButton" class="secondary hide" type="button">Change name</button>
        </div>
      </header>

      <div id="globalMessage" class="message"></div>

      <section id="authPanel" class="panel">
        <div class="panel-header">
          <div class="panel-title">
            <h2>Choose your name</h2>
            <span>No email required.</span>
          </div>
        </div>
        <form id="authForm" class="auth-box">
          <input id="emailInput" type="text" autocomplete="name" placeholder="Your display name" minlength="2" maxlength="40" required>
          <button id="magicLinkButton" type="submit">Continue</button>
        </form>
      </section>

      <section class="grid" style="margin-top: 20px;">
        <div class="panel">
          <div class="panel-header tournament-header">
            <div class="panel-title">
              <h2>Tournament Matches</h2>
              <span id="matchWindowLabel">All matches in Asia/Riyadh time</span>
            </div>
            <div id="matchFilterTabs" class="filter-tabs" role="tablist" aria-label="Match filters">
              <button class="filter-tab active" type="button" data-match-filter="all" role="tab" aria-selected="true">All matches</button>
              <button class="filter-tab" type="button" data-match-filter="today" role="tab" aria-selected="false">Today</button>
              <button class="filter-tab" type="button" data-match-filter="upcoming" role="tab" aria-selected="false">Upcoming</button>
              <button class="filter-tab" type="button" data-match-filter="finished" role="tab" aria-selected="false">Finished</button>
            </div>
          </div>
          <div id="matchesList" class="matches">
            <div class="loading">Loading matches...</div>
          </div>
        </div>

        <aside class="panel">
          <div class="panel-header">
            <div class="panel-title">
              <h2>Leaderboard</h2>
              <span id="participantCount">0 participants</span>
            </div>
          </div>
          <div id="leaderboardList" class="leaderboard-list">
            <div class="loading">Loading leaderboard...</div>
          </div>
          <div id="adminPanel" class="admin">
            <button id="fetchMatchesButton" type="button">Fetch official results</button>
          </div>
        </aside>
      </section>
    </main>

    <script>
      const SUPABASE_URL = "https://ojoroqmmvbhbqpugbkhy.supabase.co";
      const SUPABASE_ANON_KEY = "sb_publishable_BeVUdF56wvidKtUD_lZIWg_iBMP5E_J";
      const MECCA_TIME_ZONE = "Asia/Riyadh";
      const WORLD_CUP_SEASON = 2026;
      const LOCAL_PLAYER_KEY = "wc2026_public_player";
      const MATCH_FILTERS = {
        ALL: "all",
        TODAY: "today",
        UPCOMING: "upcoming",
        FINISHED: "finished",
      };
      const TEAM_FLAGS = {
        Mexico: "🇲🇽",
        "South Africa": "🇿🇦",
        "Korea Republic": "🇰🇷",
        "South Korea": "🇰🇷",
        Czechia: "🇨🇿",
        Canada: "🇨🇦",
        "Bosnia and Herzegovina": "🇧🇦",
        Qatar: "🇶🇦",
        Switzerland: "🇨🇭",
        Brazil: "🇧🇷",
        Haiti: "🇭🇹",
        Morocco: "🇲🇦",
        Scotland: "\uD83C\uDFF4\uDB40\uDC67\uDB40\uDC62\uDB40\uDC73\uDB40\uDC63\uDB40\uDC74\uDB40\uDC7F",
        Australia: "🇦🇺",
        Paraguay: "🇵🇾",
        Turkey: "🇹🇷",
        Türkiye: "🇹🇷",
        "United States": "🇺🇸",
        USA: "🇺🇸",
        "Côte d'Ivoire": "🇨🇮",
        "Cote d'Ivoire": "🇨🇮",
        "Ivory Coast": "🇨🇮",
        Curacao: "🇨🇼",
        Curaçao: "🇨🇼",
        Ecuador: "🇪🇨",
        Germany: "🇩🇪",
        Japan: "🇯🇵",
        Netherlands: "🇳🇱",
        Sweden: "🇸🇪",
        Tunisia: "🇹🇳",
        Belgium: "🇧🇪",
        Egypt: "🇪🇬",
        Iran: "🇮🇷",
        "IR Iran": "🇮🇷",
        "New Zealand": "🇳🇿",
        "Cape Verde": "🇨🇻",
        "Cabo Verde": "🇨🇻",
        "Saudi Arabia": "🇸🇦",
        Spain: "🇪🇸",
        Uruguay: "🇺🇾",
        France: "🇫🇷",
        Iraq: "🇮🇶",
        Norway: "🇳🇴",
        Senegal: "🇸🇳",
        Algeria: "🇩🇿",
        Argentina: "🇦🇷",
        Austria: "🇦🇹",
        Jordan: "🇯🇴",
        Colombia: "🇨🇴",
        "Congo DR": "🇨🇩",
        "DR Congo": "🇨🇩",
        Portugal: "🇵🇹",
        Uzbekistan: "🇺🇿",
        Croatia: "🇭🇷",
        England: "\uD83C\uDFF4\uDB40\uDC67\uDB40\uDC62\uDB40\uDC65\uDB40\uDC6E\uDB40\uDC67\uDB40\uDC7F",
        Ghana: "🇬🇭",
        Panama: "🇵🇦",
      };

      const state = {
        client: null,
        player: null,
        matches: [],
        activeFilter: MATCH_FILTERS.ALL,
        channel: null,
        countdownTimer: null,
        leaderboardTimer: null,
      };

      const els = {};

      document.addEventListener("DOMContentLoaded", init);

      async function init() {
        cacheElements();
        bindEvents();
        updateDateLabels();

        if (!isConfigured()) {
          setMessage("Replace SUPABASE_URL and SUPABASE_ANON_KEY in index.html before deploying.", "error");
          els.magicLinkButton.disabled = true;
          els.refreshButton.disabled = true;
          els.matchesList.innerHTML = '<div class="empty">Supabase is not configured yet.</div>';
          els.leaderboardList.innerHTML = '<div class="empty">Supabase is not configured yet.</div>';
          return;
        }

        if (!window.supabase?.createClient) {
          setMessage("Supabase JS did not load. Check CDN or network access.", "error");
          els.magicLinkButton.disabled = true;
          els.refreshButton.disabled = true;
          els.matchesList.innerHTML = '<div class="empty">Supabase JS is unavailable.</div>';
          els.leaderboardList.innerHTML = '<div class="empty">Supabase JS is unavailable.</div>';
          return;
        }

        state.client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        state.player = loadPlayer();

        await refreshAll();
        window.setInterval(loadMatches, 60000);
        window.addEventListener("beforeunload", clearCountdownTimer);
      }

      function cacheElements() {
        [
          "adminPanel",
          "authForm",
          "authPanel",
          "dateLabel",
          "emailInput",
          "fetchMatchesButton",
          "globalMessage",
          "leaderboardList",
          "magicLinkButton",
          "matchFilterTabs",
          "matchesList",
          "matchWindowLabel",
          "participantCount",
          "realtimeStatus",
          "refreshButton",
          "signOutButton",
          "userLabel",
        ].forEach((id) => {
          els[id] = document.getElementById(id);
        });
      }

      function bindEvents() {
        els.authForm.addEventListener("submit", savePlayerName);
        els.signOutButton.addEventListener("click", showNameForm);
        els.refreshButton.addEventListener("click", refreshAll);
        els.fetchMatchesButton.addEventListener("click", fetchOfficialResults);
        els.matchFilterTabs.addEventListener("click", changeMatchFilter);
        els.matchesList.addEventListener("click", (event) => {
          const button = event.target.closest("button[data-save-match]");
          if (button) savePrediction(button.dataset.saveMatch);
        });
      }

      function changeMatchFilter(event) {
        const button = event.target.closest("button[data-match-filter]");
        if (!button) return;

        state.activeFilter = button.dataset.matchFilter;
        renderMatches();
      }

      function isConfigured() {
        return (
          SUPABASE_URL.startsWith("https://") &&
          !SUPABASE_URL.includes("YOUR_PROJECT_REF") &&
          SUPABASE_ANON_KEY.length > 20 &&
          !SUPABASE_ANON_KEY.includes("YOUR_SUPABASE_ANON_KEY")
        );
      }

      async function refreshAll() {
        renderIdentity();
        await Promise.all([loadMatches(), loadLeaderboard()]);
        await configureRealtime();
      }

      async function savePlayerName(event) {
        event.preventDefault();
        clearMessage();

        const displayName = normalizeDisplayName(els.emailInput.value);
        if (!displayName) {
          setMessage("Enter a name from 2 to 40 characters.", "error");
          return;
        }

        const current = state.player;
        state.player = {
          id: current?.id || crypto.randomUUID(),
          editToken: current?.editToken || randomToken(),
          displayName,
        };

        setBusy(els.magicLinkButton, true, "Saving...");
        try {
          const { error } = await state.client.rpc("register_guest_player", {
            p_guest_id: state.player.id,
            p_edit_token: state.player.editToken,
            p_display_name: state.player.displayName,
          });

          if (error) throw error;

          localStorage.setItem(LOCAL_PLAYER_KEY, JSON.stringify(state.player));
          renderIdentity();
          await Promise.all([loadMatches(), loadLeaderboard()]);
          setMessage("Name saved. You can now predict open matches.", "success");
        } catch (error) {
          state.player = current;
          setMessage(error.message || "Could not save name.", "error");
        } finally {
          setBusy(els.magicLinkButton, false, "Continue");
        }
      }

      function showNameForm() {
        clearMessage();
        els.authPanel.classList.remove("hide");
        els.emailInput.value = state.player?.displayName || "";
        window.setTimeout(() => els.emailInput.focus(), 0);
      }

      function loadPlayer() {
        try {
          const player = JSON.parse(localStorage.getItem(LOCAL_PLAYER_KEY) || "null");
          if (!player?.id || !player?.editToken || !player?.displayName) return null;
          return player;
        } catch {
          return null;
        }
      }

      async function loadMatches() {
        updateDateLabels();

        try {
          const { data: matches, error } = await state.client
            .from("matches")
            .select(
              "football_data_id,utc_date,status,stage,group_name,matchday,home_team_name,home_team_tla,home_team_crest,away_team_name,away_team_tla,away_team_crest,score_home,score_away",
            )
            .order("utc_date", { ascending: true });

          if (error) throw error;

          const predictionMap = await loadCurrentPlayerPredictions(matches ?? []);
          state.matches = (matches ?? []).map((match) => ({
            ...match,
            prediction: predictionMap.get(String(match.football_data_id)) ?? null,
          }));

          renderMatches();
        } catch (error) {
          clearCountdownTimer();
          els.matchesList.innerHTML = `<div class="empty">${escapeHtml(error.message || "Could not load matches.")}</div>`;
        }
      }

      async function loadCurrentPlayerPredictions(matches) {
        const map = new Map();
        if (!state.player || matches.length === 0) return map;

        const ids = matches.map((match) => match.football_data_id);
        const { data, error } = await state.client
          .from("predictions")
          .select("match_id,home_score,away_score,points")
          .eq("guest_id", state.player.id)
          .in("match_id", ids);

        if (error) throw error;
        (data ?? []).forEach((prediction) => {
          map.set(String(prediction.match_id), prediction);
        });
        return map;
      }

      async function loadLeaderboard() {
        try {
          const [{ data: rows, error: leaderboardError }, { data: count, error: countError }] = await Promise.all([
            state.client.rpc("leaderboard"),
            state.client.rpc("participant_count"),
          ]);

          if (leaderboardError) throw leaderboardError;
          if (countError) throw countError;

          els.participantCount.textContent = `${count ?? 0} ${Number(count) === 1 ? "participant" : "participants"}`;
          renderLeaderboard(rows ?? []);
        } catch (error) {
          els.leaderboardList.innerHTML = `<div class="empty">${escapeHtml(error.message || "Could not load leaderboard.")}</div>`;
        }
      }

      async function configureRealtime() {
        if (state.channel) {
          await state.client.removeChannel(state.channel);
          state.channel = null;
        }

        state.channel = state.client
          .channel("leaderboard-predictions")
          .on(
            "postgres_changes",
            { event: "*", schema: "public", table: "predictions" },
            () => {
              window.clearTimeout(state.leaderboardTimer);
              state.leaderboardTimer = window.setTimeout(() => {
                loadLeaderboard();
                loadMatches();
              }, 250);
            },
          )
          .on(
            "postgres_changes",
            { event: "*", schema: "public", table: "guest_players" },
            () => {
              window.clearTimeout(state.leaderboardTimer);
              state.leaderboardTimer = window.setTimeout(loadLeaderboard, 250);
            },
          )
          .subscribe((status) => {
            els.realtimeStatus.textContent = `Realtime ${status.toLowerCase()}`;
          });
      }

      function renderIdentity() {
        if (!state.player) {
          els.authPanel.classList.remove("hide");
          els.signOutButton.classList.add("hide");
          els.userLabel.textContent = "No name";
          els.adminPanel.classList.add("show");
          return;
        }

        els.authPanel.classList.add("hide");
        els.signOutButton.classList.remove("hide");
        els.userLabel.textContent = state.player.displayName;
        els.adminPanel.classList.add("show");
      }

      function renderMatches() {
        updateFilterTabs();
        clearCountdownTimer();

        if (state.matches.length === 0) {
          els.matchWindowLabel.textContent = "No matches loaded";
          els.matchesList.innerHTML = '<div class="empty">No World Cup matches are stored yet.</div>';
          return;
        }

        const visibleMatches = state.matches.filter(matchPassesActiveFilter);
        els.matchWindowLabel.textContent = matchListSummary(visibleMatches, state.matches.length);

        if (visibleMatches.length === 0) {
          els.matchesList.innerHTML = `<div class="empty">${escapeHtml(emptyFilterMessage())}</div>`;
          return;
        }

        els.matchesList.innerHTML = groupMatchesByMeccaDate(visibleMatches)
          .map(([dateKey, matches]) => renderMatchGroup(dateKey, matches))
          .join("");

        resetCountdownTimer();
      }

      function renderMatchGroup(dateKey, matches) {
        return `
          <section class="match-date-section" aria-label="${escapeAttribute(formatDateHeading(dateKey))}">
            <div class="date-heading">
              <h3>${escapeHtml(formatDateHeading(dateKey))}</h3>
              <span>${matches.length} ${matches.length === 1 ? "match" : "matches"}</span>
            </div>
            ${matches.map(renderMatch).join("")}
          </section>
        `;
      }

      function renderMatch(match) {
        const kickoff = new Date(match.utc_date);
        const isOpen = isPredictionOpen(match);
        const finished = isFinishedMatch(match);
        const finalScore = hasFinalScore(match);
        const prediction = match.prediction;
        const statusClass = isOpen ? "open" : finished ? "finished" : "locked";
        const resultText = finalScore
          ? `${Number(match.score_home)} - ${Number(match.score_away)}`
          : "vs";
        const statusText = finished ? "FINISHED" : match.status || "SCHEDULED";
        const lockReason = predictionLockReason(match);
        const groupStage = [match.stage, match.group_name].filter(Boolean).join(" / ");
        const countdown = isFutureScheduledMatch(match)
          ? `<div class="countdown" data-countdown="${escapeAttribute(match.football_data_id)}" data-kickoff-ms="${kickoff.getTime()}">${escapeHtml(formatCountdown(kickoff.getTime() - Date.now()))}</div>`
          : "";

        return `
          <article class="match-card">
            <div class="match-main">
              ${renderTeam(match.home_team_name, match.home_team_tla, match.home_team_crest, "home")}
              <div class="score-box">
                <div class="kickoff">${escapeHtml(formatMeccaTime(kickoff))}</div>
                <div class="score-line ${finalScore ? "final" : ""}">${escapeHtml(resultText)}</div>
                <div class="status ${statusClass}">${escapeHtml(statusText)}</div>
                ${countdown}
              </div>
              ${renderTeam(match.away_team_name, match.away_team_tla, match.away_team_crest, "away")}
            </div>
            ${isOpen
              ? renderPredictionForm(match, prediction, groupStage, lockReason)
              : renderMatchDetails(match, prediction, groupStage, lockReason, finished)}
          </article>
        `;
      }

      function renderPredictionForm(match, prediction, groupStage, lockReason) {
        const homeValue = prediction?.home_score ?? "";
        const awayValue = prediction?.away_score ?? "";
        const matchId = escapeAttribute(match.football_data_id);

        return `
          <div class="prediction-row">
            <input
              data-home-score="${matchId}"
              type="number"
              min="0"
              max="99"
              step="1"
              inputmode="numeric"
              placeholder="Home"
              value="${escapeAttribute(homeValue)}"
            >
            <span class="dash">-</span>
            <input
              data-away-score="${matchId}"
              type="number"
              min="0"
              max="99"
              step="1"
              inputmode="numeric"
              placeholder="Away"
              value="${escapeAttribute(awayValue)}"
            >
            <button type="button" data-save-match="${matchId}">Save</button>
            <div class="prediction-note">
              ${escapeHtml(groupStage || "World Cup 2026")}
              ${prediction ? ` · Saved: ${escapeHtml(formatPrediction(prediction))}` : ""}
              · ${escapeHtml(lockReason)}
            </div>
          </div>
        `;
      }

      function renderMatchDetails(match, prediction, groupStage, lockReason, finished) {
        const firstLabel = finished ? "Final score" : "Match";
        const firstValue = finished && hasFinalScore(match)
          ? `${Number(match.score_home)} - ${Number(match.score_away)}`
          : groupStage || "World Cup 2026";
        const predictionText = prediction ? formatPrediction(prediction) : "No saved prediction";
        const points = prediction?.points ?? 0;

        return `
          <div class="match-details">
            <div class="detail-box">
              <div class="detail-label">${escapeHtml(firstLabel)}</div>
              <div class="detail-value">${escapeHtml(firstValue)}</div>
            </div>
            <div class="detail-box">
              <div class="detail-label">Your prediction</div>
              <div class="detail-value">${escapeHtml(predictionText)}</div>
            </div>
            <div class="detail-box">
              <div class="detail-label">${finished ? "Points gained" : "Status"}</div>
              <div class="detail-value ${finished ? "points-value" : ""}">${escapeHtml(finished ? points : lockReason)}</div>
            </div>
          </div>
        `;
      }

      function renderTeam(name, tla, crest, side) {
        const safeName = escapeHtml(name || "TBD");
        const safeTla = escapeHtml(tla || "");
        const fallback = escapeHtml((tla || name || "TBD").slice(0, 3).toUpperCase());
        const flag = escapeHtml(getTeamFlag(name));
        const image = crest
          ? `<img src="${escapeAttribute(crest)}" alt="${safeName} crest" loading="lazy" onerror="this.outerHTML='${escapeAttribute(fallback)}'">`
          : fallback;
        const nameHtml = `<div class="team-name"><span class="team-flag" aria-hidden="true">${flag}</span><span>${safeName}</span></div>`;

        if (side === "away") {
          return `
            <div class="team away">
              <div>
                ${nameHtml}
                <div class="team-code">${safeTla}</div>
              </div>
              <div class="crest">${image}</div>
            </div>
          `;
        }

        return `
          <div class="team">
            <div class="crest">${image}</div>
            <div>
              ${nameHtml}
              <div class="team-code">${safeTla}</div>
            </div>
          </div>
        `;
      }

      function updateFilterTabs() {
        els.matchFilterTabs.querySelectorAll("button[data-match-filter]").forEach((button) => {
          const active = button.dataset.matchFilter === state.activeFilter;
          button.classList.toggle("active", active);
          button.setAttribute("aria-selected", active ? "true" : "false");
        });
      }

      function matchPassesActiveFilter(match) {
        if (state.activeFilter === MATCH_FILTERS.TODAY) {
          return getMeccaDateKey(new Date(match.utc_date)) === getMeccaDateKey(new Date());
        }

        if (state.activeFilter === MATCH_FILTERS.UPCOMING) {
          return isFutureScheduledMatch(match);
        }

        if (state.activeFilter === MATCH_FILTERS.FINISHED) {
          return isFinishedMatch(match);
        }

        return true;
      }

      function groupMatchesByMeccaDate(matches) {
        const groups = new Map();
        matches.forEach((match) => {
          const key = getMeccaDateKey(new Date(match.utc_date));
          if (!groups.has(key)) groups.set(key, []);
          groups.get(key).push(match);
        });
        return Array.from(groups.entries());
      }

      function matchListSummary(visibleMatches, totalMatches) {
        const label = {
          [MATCH_FILTERS.ALL]: "All matches",
          [MATCH_FILTERS.TODAY]: "Today",
          [MATCH_FILTERS.UPCOMING]: "Upcoming",
          [MATCH_FILTERS.FINISHED]: "Finished",
        }[state.activeFilter] || "All matches";

        return `${label}: ${visibleMatches.length} of ${totalMatches} matches · Asia/Riyadh`;
      }

      function emptyFilterMessage() {
        if (state.activeFilter === MATCH_FILTERS.TODAY) return "No matches are scheduled for today in Mecca time.";
        if (state.activeFilter === MATCH_FILTERS.UPCOMING) return "No future scheduled matches are currently open.";
        if (state.activeFilter === MATCH_FILTERS.FINISHED) return "No finished matches are available yet.";
        return "No matches match this filter.";
      }

      function isFutureScheduledMatch(match) {
        return match.status === "SCHEDULED" && new Date(match.utc_date).getTime() > Date.now();
      }

      function isFinishedMatch(match) {
        return hasFinalScore(match) || ["FINISHED", "FULL_TIME", "AWARDED"].includes(String(match.status || "").toUpperCase());
      }

      function hasFinalScore(match) {
        return isScoreValue(match.score_home) && isScoreValue(match.score_away);
      }

      function isScoreValue(value) {
        return value !== null && value !== undefined && value !== "" && Number.isFinite(Number(value));
      }

      function formatPrediction(prediction) {
        return `${Number(prediction.home_score)} - ${Number(prediction.away_score)}`;
      }

      function resetCountdownTimer() {
        clearCountdownTimer();
        const hadExpiredCountdown = updateCountdowns();

        if (hadExpiredCountdown) return;

        if (document.querySelector("[data-countdown]")) {
          state.countdownTimer = window.setInterval(updateCountdowns, 1000);
        }
      }

      function clearCountdownTimer() {
        if (!state.countdownTimer) return;
        window.clearInterval(state.countdownTimer);
        state.countdownTimer = null;
      }

      function updateCountdowns() {
        const countdowns = Array.from(document.querySelectorAll("[data-countdown]"));
        let hasExpired = false;

        countdowns.forEach((node) => {
          const kickoffMs = Number(node.dataset.kickoffMs);
          const remainingMs = kickoffMs - Date.now();

          if (!Number.isFinite(kickoffMs) || remainingMs <= 0) {
            hasExpired = true;
            node.textContent = "Kickoff reached";
            return;
          }

          node.textContent = formatCountdown(remainingMs);
        });

        if (hasExpired) {
          renderMatches();
        }

        return hasExpired;
      }

      function formatCountdown(milliseconds) {
        const totalSeconds = Math.max(0, Math.floor(milliseconds / 1000));
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;
        return `Starts in ${hours}h ${minutes}m ${seconds}s`;
      }

      function getTeamFlag(name) {
        const teamName = String(name || "").trim();
        return TEAM_FLAGS[teamName] || "⚽";
      }

      function renderLeaderboard(rows) {
        if (rows.length === 0) {
          els.leaderboardList.innerHTML = '<div class="empty">No members yet.</div>';
          return;
        }

        els.leaderboardList.innerHTML = rows.map((row, index) => `
          <div class="leader-row">
            <div class="rank">${index + 1}</div>
            <div>
              <div class="leader-name">${escapeHtml(row.display_name || "Player")}</div>
              <div class="leader-meta">${row.predictions_count} predictions · ${row.exact_scores} exact · ${row.correct_outcomes} outcome</div>
            </div>
            <div class="points">${row.total_points}</div>
          </div>
        `).join("");
      }

      async function savePrediction(matchId) {
        clearMessage();

        if (!state.player) {
          setMessage("Enter your name before saving predictions.", "error");
          showNameForm();
          return;
        }

        const match = state.matches.find((item) => String(item.football_data_id) === String(matchId));
        if (!match || !isPredictionOpen(match)) {
          setMessage("This match is locked.", "error");
          await loadMatches();
          return;
        }

        const homeInput = document.querySelector(`[data-home-score="${matchId}"]`);
        const awayInput = document.querySelector(`[data-away-score="${matchId}"]`);
        const homeScore = readScore(homeInput);
        const awayScore = readScore(awayInput);

        if (homeScore === null || awayScore === null) {
          setMessage("Scores must be whole numbers from 0 to 99.", "error");
          return;
        }

        const button = document.querySelector(`[data-save-match="${matchId}"]`);
        setBusy(button, true, "Saving...");

        try {
          const { error } = await state.client.rpc("save_guest_prediction", {
            p_guest_id: state.player.id,
            p_edit_token: state.player.editToken,
            p_display_name: state.player.displayName,
            p_match_id: Number(matchId),
            p_home_score: homeScore,
            p_away_score: awayScore,
          });

          if (error) throw error;
          setMessage("Prediction saved.", "success");
          await Promise.all([loadMatches(), loadLeaderboard()]);
        } catch (error) {
          setMessage(error.message || "Could not save prediction.", "error");
          await loadMatches();
        } finally {
          setBusy(button, false, "Save");
        }
      }

      async function fetchOfficialResults() {
        clearMessage();

        const adminPin = window.prompt("Admin PIN");
        if (!adminPin) return;

        setBusy(els.fetchMatchesButton, true, "Fetching...");

        try {
          const { data, error } = await state.client.functions.invoke("fetch-matches", {
            body: { season: WORLD_CUP_SEASON },
            headers: { "x-admin-pin": adminPin },
          });

          if (error) throw error;
          setMessage(`Official results refreshed. ${data?.upserted ?? 0} matches upserted.`, "success");
          await Promise.all([loadMatches(), loadLeaderboard()]);
        } catch (error) {
          setMessage(error.message || "Could not fetch official results.", "error");
        } finally {
          setBusy(els.fetchMatchesButton, false, "Fetch official results");
        }
      }

      function isPredictionOpen(match) {
        return Boolean(
          state.player &&
          match.status === "SCHEDULED" &&
          new Date(match.utc_date).getTime() > Date.now(),
        );
      }

      function predictionLockReason(match) {
        if (!state.player) return "Enter your name to predict";
        if (match.status !== "SCHEDULED") return "Locked by match status";
        if (new Date(match.utc_date).getTime() <= Date.now()) return "Locked after kickoff";
        return "Open until kickoff";
      }

      function readScore(input) {
        const value = input?.value.trim() ?? "";
        if (!/^\d{1,2}$/.test(value)) return null;
        const score = Number(value);
        return Number.isInteger(score) && score >= 0 && score <= 99 ? score : null;
      }

      function normalizeDisplayName(value) {
        const name = String(value ?? "").replace(/\s+/g, " ").trim();
        if (name.length < 2 || name.length > 40) return "";
        return name;
      }

      function randomToken() {
        const bytes = new Uint8Array(32);
        crypto.getRandomValues(bytes);
        return Array.from(bytes, (byte) => byte.toString(16).padStart(2, "0")).join("");
      }

      function updateDateLabels() {
        els.dateLabel.textContent = `${formatDateHeading(getMeccaDateKey(new Date()))} in Mecca time`;
        els.matchWindowLabel.textContent = "All matches in Asia/Riyadh time";
      }

      function getMeccaDateKey(date) {
        return new Intl.DateTimeFormat("en-CA", {
          timeZone: MECCA_TIME_ZONE,
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
        }).format(date);
      }

      function formatDateHeading(dateKey) {
        const todayKey = getMeccaDateKey(new Date());
        if (dateKey === todayKey) return "Today";
        if (dateKey === shiftDateKey(todayKey, 1)) return "Tomorrow";

        const [year, month, day] = dateKey.split("-").map(Number);
        return new Intl.DateTimeFormat("en-GB", {
          timeZone: "UTC",
          weekday: "long",
          day: "numeric",
          month: "long",
        }).format(new Date(Date.UTC(year, month - 1, day, 12))).replace(",", "");
      }

      function shiftDateKey(dateKey, days) {
        const [year, month, day] = dateKey.split("-").map(Number);
        const shifted = new Date(Date.UTC(year, month - 1, day + days, 12));
        const shiftedYear = shifted.getUTCFullYear();
        const shiftedMonth = String(shifted.getUTCMonth() + 1).padStart(2, "0");
        const shiftedDay = String(shifted.getUTCDate()).padStart(2, "0");
        return `${shiftedYear}-${shiftedMonth}-${shiftedDay}`;
      }

      function formatMeccaTime(date) {
        return new Intl.DateTimeFormat("en", {
          timeZone: MECCA_TIME_ZONE,
          hour: "2-digit",
          minute: "2-digit",
        }).format(date);
      }

      function setBusy(button, busy, label) {
        if (!button) return;
        button.disabled = busy;
        button.textContent = label;
      }

      function setMessage(message, type = "") {
        els.globalMessage.textContent = message;
        els.globalMessage.className = `message show ${type}`.trim();
      }

      function clearMessage() {
        els.globalMessage.textContent = "";
        els.globalMessage.className = "message";
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function escapeAttribute(value) {
        return escapeHtml(value);
      }
    </script>
  </body>
</html>
